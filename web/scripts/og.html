<!doctype html>
<!--
  Source of public/og.png, the social preview image (1200×630).
  To change it: edit this file and take a 1200×630 screenshot, for example:
    "<Chrome or Brave>" --headless=new --user-data-dir=$(mktemp -d) --window-size=1200,630 \
      --screenshot=public/og.png file://$PWD/scripts/og.html
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Quiver social image</title>
		<style>
			@font-face {
				font-family: 'Hanken';
				src: url('../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2') format('woff2');
				font-weight: 100 900;
			}
			html,
			body {
				margin: 0;
				width: 1200px;
				height: 630px;
				overflow: hidden;
				background: #ffffff;
				color: #111111;
				font-family: 'Hanken', sans-serif;
			}
			.brand {
				position: absolute;
				left: 72px;
				top: 64px;
				display: flex;
				align-items: center;
				gap: 14px;
				font-size: 34px;
				font-weight: 500;
				letter-spacing: -0.03em;
			}
			h1 {
				position: absolute;
				left: 72px;
				top: 170px;
				width: 680px;
				margin: 0;
				font-size: 84px;
				font-weight: 500;
				line-height: 0.92;
				letter-spacing: -0.05em;
			}
			.url {
				position: absolute;
				left: 72px;
				bottom: 64px;
				font-size: 24px;
				color: #5f5f5f;
			}
			.stage {
				position: absolute;
				right: 0;
				bottom: 0;
				width: 470px;
				height: 470px;
				background: #1a4be0;
				clip-path: polygon(0 180px, 118px 180px, 118px 120px, 235px 120px, 235px 60px, 352px 60px, 352px 0, 100% 0, 100% 100%, 0 100%);
			}
		</style>
	</head>
	<body>
		<div class="brand">
			<svg viewBox="0 0 22 22" width="34" height="34"><rect x="0" y="0" width="22" height="4" fill="#111"/><rect x="5.5" y="6" width="16.5" height="4" fill="#111"/><rect x="11" y="12" width="11" height="4" fill="#111"/><rect x="16.5" y="18" width="5.5" height="4" fill="#1a4be0"/></svg>
			quiver
		</div>
		<h1>Agent skills, managed in layers.</h1>
		<p class="url">kheif.github.io/quiver</p>
		<div class="stage"></div>
	</body>
</html>
