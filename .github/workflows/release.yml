name: Release

# Pushing a tag such as v1.0.0 publishes the GitHub release and the npm
# packages, then installs both on clean machines to check them.
on:
  push:
    tags: ["v*"]

permissions:
  actions: read # read the CI runs of the tagged commit
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    # Pauses for the maintainer's approval; only v* tags may deploy to it.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from the history
      # Every release tag is annotated (docs/releasing.md). A lightweight tag
      # carries no message and no tagger, so it is refused.
      - name: Refuse a lightweight tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          kind=$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")
          if [ "$kind" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a $kind, not an annotated tag. Delete it and tag again with git tag -a."
            exit 1
          fi
      # The release waits for the CI run of the tagged commit and stops unless
      # it succeeded: a tag cannot publish a commit that CI did not pass.
      - name: Wait for green CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion)
            total=$(echo "$runs" | jq length)
            pending=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$runs" | jq '[.[] | select(.status == "completed" and .conclusion != "success")] | length')
            if [ "$failed" -gt 0 ]; then
              echo "::error::The CI run of $GITHUB_SHA did not succeed."
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "CI is green for $GITHUB_SHA."
              exit 0
            fi
            echo "Waiting for CI of $GITHUB_SHA ($total runs, $pending pending)..."
            sleep 30
          done
          echo "::error::No finished CI run for $GITHUB_SHA after 30 minutes."
          exit 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest Go with security fixes; go.mod's go line is only the minimum.
          go-version: stable
          check-latest: true
      - run: go test ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      # npm trusted publishing (OIDC): no token is stored. Versions that are
      # already on npm are skipped, such as a first release published by
      # hand (docs/releasing.md).
      - run: node scripts/npm-publish.mjs "$GITHUB_REF_NAME"

  verify-curl:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: curl -fsSL "https://raw.githubusercontent.com/kheif/quiver/$GITHUB_REF_NAME/install.sh" | QUIVER_VERSION="$GITHUB_REF_NAME" sh
      - run: ~/.local/bin/quiver --version | grep -F "${GITHUB_REF_NAME#v}"

  verify-powershell:
    needs: release
    runs-on: windows-latest
    steps:
      - shell: powershell
        run: |
          $env:QUIVER_VERSION = $env:GITHUB_REF_NAME
          irm "https://raw.githubusercontent.com/kheif/quiver/$env:GITHUB_REF_NAME/install.ps1" | iex
      - shell: pwsh
        run: |
          # A new shell's PATH, from the registry.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          $v = quiver --version
          if ($v -notlike "*$($env:GITHUB_REF_NAME.TrimStart('v'))*") { throw "quiver --version printed $v" }

  verify-npm:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # A new version can take several minutes to show up on the registry, and
      # the tarball of a platform package a little after its metadata does. So
      # the check that the installed binary runs is part of the retry: an
      # install that lacks the platform package is not a failure yet.
      - run: |
          for i in $(seq 1 30); do
            if npm install -g "@kheif/quiver@${GITHUB_REF_NAME#v}" && quiver --version | grep -F "${GITHUB_REF_NAME#v}"; then
              exit 0
            fi
            # A repeated install of the same version would keep what is there.
            npm uninstall -g @kheif/quiver || true
            sleep 30
          done
          echo "@kheif/quiver@${GITHUB_REF_NAME#v} did not install and run within 15 minutes"
          exit 1
