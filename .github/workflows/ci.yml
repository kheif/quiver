name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Unit tests and the end-to-end suite in e2e/, which builds the binary.
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # A release without publishing: the archives, install.sh and the npm
  # packages, installed on a clean machine.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --snapshot --clean
      - name: install.sh
        run: |
          QUIVER_DOWNLOAD_URL="file://$PWD/dist" QUIVER_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/quiver" --version
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm packages
        run: |
          node scripts/npm-publish.mjs 0.0.0-ci --pack
          npm install -g dist/npm/kheif-quiver-0.0.0-ci.tgz dist/npm/kheif-quiver-linux-x64-0.0.0-ci.tgz
          quiver --version
