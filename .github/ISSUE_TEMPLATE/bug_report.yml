name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: quiver --version
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System and assistant
      description: For example macOS 15, Claude Code 2.1
  - type: textarea
    id: doctor
    attributes:
      label: quiver doctor
      description: The output of `quiver doctor`. Remove anything private.
      render: text
