name: Feature request
description: Something Quiver should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what is hard about it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How Quiver could help. Check PROJECT.md's roadmap first.
